services:
  metabase:
    image: metabase/metabase:latest
    container_name: afc_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_CONNECTION_URI: "jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}?user=${DATABASE_USER}&password=${DATABASE_PASSWORD}&sslmode=require"

volumes:
  postgres_data: